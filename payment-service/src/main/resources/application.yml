server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/payment_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
demo:
  enabled: ${DEMO_ENABLED:true}
